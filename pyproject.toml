[project]
name = "chronosync"
dynamic = ["version"]
description = "A lightweight CLI tool to bidirectionally synchronize local development database states and test fixtures across team members without dumping heavy files into git."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
chronosync = "chronosync.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "chronosync.__version__" }

[tool.setuptools.packages.find]
include = ["chronosync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
